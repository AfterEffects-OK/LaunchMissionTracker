<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Mission Tracker</title>
  
  <!-- ファビコン設定 -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AfterEffects-OK/LaunchMissionTracker/main/watermarked_img_6832602719000808661.png">

  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(16, 22, 36, 0.85);
      --accent-blue: #00f2ff;
      --accent-glow: rgba(0, 242, 255, 0.3);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: rgba(0, 242, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-blue);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end; /* 右寄せ */
    }
    
    .control-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button, input, textarea, a.live-link-btn {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }

    button, a.live-link-btn {
      cursor: pointer;
      background: rgba(0, 242, 255, 0.15);
      font-weight: bold;
    }

    button:hover, a.live-link-btn:hover {
      background: var(--accent-blue);
      color: #000;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1200px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .sequence-card {
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 140px);
    }

    .launch-list-card {
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 140px);
    }

    .launch-scroll-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 210px);
      padding-right: 5px;
      margin-top: 15px;
    }

    .launch-scroll-container::-webkit-scrollbar,
    .timeline-container::-webkit-scrollbar,
    .modal-content::-webkit-scrollbar,
    textarea::-webkit-scrollbar {
      width: 6px;
    }

    .launch-scroll-container::-webkit-scrollbar-thumb,
    .timeline-container::-webkit-scrollbar-thumb,
    .modal-content::-webkit-scrollbar-thumb,
    textarea::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .launch-item-btn {
      width: 100%;
      text-align: left;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .launch-item-btn:hover {
      background: rgba(0, 242, 255, 0.1);
      border-color: var(--accent-blue);
    }

    .launch-item-btn.selected {
      background: rgba(0, 242, 255, 0.2);
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .launch-item-provider {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .launch-item-name {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .launch-item-date {
      font-size: 0.8rem;
      color: var(--accent-blue);
      margin-top: 4px;
      font-family: monospace;
    }

    .countdown-display {
      text-align: center;
      padding: 20px 10px;
    }

    .mission-title {
      font-size: 1.8rem;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.3em;
    }

    .mission-main-text {
      white-space: nowrap;
    }

    .mission-sub-text {
      white-space: nowrap;
      color: var(--text-muted);
      font-size: 1.4rem;
    }

    .mission-sub {
      color: var(--text-muted);
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    .timer {
      font-family: monospace, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      letter-spacing: 2px;
      margin: 10px 0;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 242, 255, 0.2);
      border: 1px solid var(--accent-blue);
    }

    .info-sub-box {
      margin: 10px 0 15px 0;
      font-size: 0.9rem;
    }

    #targetTime {
      color: var(--text-muted);
    }

    #launchWindow {
      color: var(--accent-blue);
      font-family: monospace;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .live-link-container {
      margin-bottom: 15px;
      display: none;
    }

    .live-link-container.visible {
      display: block;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .telemetry-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .telemetry-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .telemetry-value {
      font-family: monospace;
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent-blue);
    }

    .event-status-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      text-align: left;
    }

    .event-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .event-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .event-countdown {
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--text-muted);
      font-weight: bold;
    }

    .event-text {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-card.current .event-text {
      font-size: 1.15rem;
      color: var(--accent-blue);
    }

    .timeline-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      margin-top: 15px;
      scroll-behavior: smooth;
      max-height: calc(100vh - 210px);
    }

    .timeline-item {
      display: flex;
      align-items: baseline;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .timeline-item.active {
      color: var(--accent-blue);
      font-weight: bold;
    }

    .timeline-item.passed {
      opacity: 0.5;
    }

    .time-offset {
      font-family: monospace;
      min-width: 80px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .timeline-item.active .time-offset {
      color: var(--accent-blue);
    }

    .edit-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10;
      justify-content: center;
      align-items: center;
    }

    .edit-modal.open {
      display: flex;
    }

    .modal-content {
      background: #101624;
      border: 1px solid var(--accent-blue);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    textarea {
      width: 100%;
      height: 250px;
      background: #05070a;
      border: 1px solid var(--border-color);
      color: #00f2ff;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      margin: 15px 0;
      resize: vertical;
    }

    .editor-nav-btn {
      background: rgba(0, 242, 255, 0.15);
      border: 1px solid rgba(0, 242, 255, 0.2);
      color: #00f2ff;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    
    .editor-nav-btn:hover {
      background: #00f2ff;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Launch Mission Tracker</h1>
      <div class="controls">
        <!-- 1行目: 進行・状態制御 ＆ 時刻設定 -->
        <div class="control-row">
          <button id="apiSyncBtn" style="background: rgba(0, 255, 128, 0.15); border-color: #00ff80;">API同期</button>
          <button id="holdBtn" style="background: rgba(255, 170, 0, 0.15); border-color: #ffaa00;">HOLD</button>
          <button id="scrubBtn" style="background: rgba(255, 68, 68, 0.15); border-color: #ff4444;">SCRUB</button>
          
          <input type="datetime-local" id="netInput" step="1" style="padding: 6px 10px; font-size: 0.85rem;">
          <button id="updateNetBtn" style="background: rgba(0, 242, 255, 0.2); border-color: var(--accent-blue);">時刻適用</button>
        </div>
      
        <!-- 2行目: 編集・エディター系ナビゲーション -->
        <div class="control-row" style="justify-content: flex-end;">
          <button id="simBtn">シミュレーション切替</button>
          <a href="./editor.html" class="btn-link editor-nav-btn">プリセットエディターを開く</a>
          <button id="editBtn">シーケンス編集</button>
        </div>
      </div>
    </header>

    <div class="main-grid">
      <div class="card launch-list-card">
        <h3 style="color: var(--accent-blue);">打ち上げ一覧</h3>
        <div id="launchListContainer" class="launch-scroll-container"></div>
      </div>

      <div class="card countdown-display">
        <div class="status-badge" id="presetBadge">PRESET</div>
        
        <h2 class="mission-title" id="missionTitle">
          <span class="mission-main-text">ミッションを選択してください</span>
        </h2>

        <div class="mission-sub" id="missionSub">---</div>
        <div class="timer" id="timerDisplay">T- 00:00:00</div>
        
        <div class="info-sub-box">
          <div id="targetTime"></div>
          <div id="launchWindow"></div>
        </div>

        <!-- ライブ配信リンク自動表示用コンテナ -->
        <div class="live-link-container" id="liveLinkContainer">
          <a id="liveLinkBtn" class="live-link-btn" href="https://www.spacex.com/launches/crew13" target="_blank" rel="noopener noreferrer">🔴 公式ライブ配信を視聴 (Crew-13)</a>
        </div>

        <div class="telemetry-grid">
          <div class="telemetry-card">
            <div class="telemetry-label">Velocity (速度)</div>
            <div class="telemetry-value" id="telemetryVelocity">0 km/h</div>
          </div>
          <div class="telemetry-card">
            <div class="telemetry-label">Altitude (高度)</div>
            <div class="telemetry-value" id="telemetryAltitude">0.0 km</div>
          </div>
        </div>

        <div class="event-status-stack">
          <div class="event-card current">
            <div class="event-header">
              <span class="event-label">CURRENT EVENT</span>
            </div>
            <div class="event-text" id="currentEventText">---</div>
          </div>
          <div class="event-card">
            <div class="event-header">
              <span class="event-label">NEXT EVENT</span>
              <span class="event-countdown" id="nextEventCountdown"></span>
            </div>
            <div class="event-text" id="nextEventText">---</div>
          </div>
        </div>
      </div>

      <div class="card sequence-card">
        <h3 style="color: var(--accent-blue);">ミッション シーケンス</h3>
        <div class="timeline-container" id="timelineList"></div>
      </div>
    </div>
  </div>

  <div class="edit-modal" id="editModal">
    <div class="modal-content">
      <h3>シーケンス 編集</h3>
      <textarea id="jsonInput"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button id="cancelEdit">キャンセル</button>
        <button id="saveEdit">保存</button>
      </div>
    </div>
  </div>

  <!-- ① 先に external な sequences.js を読み込む -->
  <script src="sequences.js"></script>

  <!-- ② メインプログラム -->
  <script>
    let mockLaunches = [
      { id: "1", name: "Crew-13 (Dragon Mission)", provider: "SpaceX", rocket: "Crew-13", pad: "Kennedy Space Center / LC-39A", net: "2026-10-05T08:00:00Z", window_start: "2026-10-05T08:00:00Z", window_end: "2026-10-05T12:00:00Z", webcast_live: "https://www.spacex.com/launches/crew13" },
      { id: "2", name: "Ariane 6 / Maiden Flight & Payloads", provider: "ESA / Arianespace", rocket: "Ariane", pad: "Kourou / ELA-4 (フランス領)", net: "2026-10-05T21:10:00Z", window_start: "2026-10-05T21:00:00Z", window_end: "2026-10-05T23:00:00Z", webcast_live: "https://www.youtube.com/watch?v=example1" },
      { id: "3", name: "PSLV-C / Earth Observation Satellite", provider: "ISRO", rocket: "PSLV", pad: "Satish Dhawan / FLP (インド)", net: "2026-10-10T04:30:00Z", window_start: "2026-10-10T04:15:00Z", window_end: "2026-10-10T05:00:00Z", webcast_live: "https://www.youtube.com/watch?v=example2" },
      { id: "4", name: "Falcon 9 / Starlink Group", provider: "SpaceX", rocket: "Falcon 9", pad: "Cape Canaveral / LC-40", net: "2026-10-15T08:15:00Z", window_start: "2026-10-15T08:15:00Z", window_end: "2026-10-15T12:15:00Z", webcast_live: "https://www.youtube.com/watch?v=example3" },
      { id: "5", name: "H3 Launch Vehicle (Flight 4)", provider: "JAXA", rocket: "H3", pad: "Tanegashima Space Center", net: "2026-10-25T05:30:00Z", window_start: "2026-10-25T05:00:00Z", window_end: "2026-10-25T07:00:00Z", webcast_live: "https://www.youtube.com/watch?v=example6" }
    ];

    mockLaunches.sort((a, b) => new Date(a.net) - new Date(b.net));

    let selectedIndex = 0;
    let timerInterval = null;
    let isSimMode = false;
    let simT = -10;
    let currentPreset = null;
    let missionState = "RUNNING";
    let heldSeconds = -10;
    let liveTelemetryCache = null;

    async function syncLaunchesFromAPI() {
      const btn = document.getElementById('apiSyncBtn');
      btn.textContent = "同期中...";
      try {
        const response = await fetch('https://lldev.thespacedevs.com/2.2.0/launch/upcoming/?limit=10', {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) throw new Error(`API Error: ${response.status}`);
        const data = await response.json();
        if (data && data.results && data.results.length > 0) {
          mockLaunches = data.results.map((item, index) => ({
            id: item.id || String(index + 1),
            name: item.name || "Unknown Mission",
            provider: item.launch_service_provider?.name || "Unknown Provider",
            rocket: item.rocket?.configuration?.name || "Rocket",
            pad: item.pad?.name || "Launch Pad",
            net: item.net || new Date().toISOString(),
            window_start: item.window_start || "",
            window_end: item.window_end || "",
            webcast_live: item.vidURLs && item.vidURLs.length > 0 ? item.vidURLs[0].url : (item.webcast_live || "")
          }));
          mockLaunches.sort((a, b) => new Date(a.net) - new Date(b.net));
          selectedIndex = 0;
          renderLaunchList();
          selectLaunch(0);
          btn.textContent = "同期成功！";
        } else {
          throw new Error("No launch data found.");
        }
      } catch (error) {
        console.warn("API同期に失敗したためフォールバックを使用:", error);
        btn.textContent = "同期失敗(オフライン)";
      }
      setTimeout(() => { btn.textContent = "API同期"; }, 3000);
    }

    // 日時変更ボタンの処理
    document.getElementById('updateNetBtn').addEventListener('click', () => {
      const inputVal = document.getElementById('netInput').value;
      if (!inputVal) return;
    
      // 1. 選択中ミッションの NET (打ち上げ予定時刻) を更新
      const newNetDate = new Date(inputVal);
      mockLaunches[selectedIndex].net = newNetDate.toISOString();
    
      // 2. HOLD や SCRUB 状態の解除（必要に応じて）
      missionState = "RUNNING";
      document.getElementById('presetBadge').textContent = "PRESET";
    
      // 3. UI表示を即座に更新
      selectLaunch(selectedIndex);
      alert("リフトオフ時刻を再設定しました。");
    });
    
    // ミッション選択時（selectLaunch）にフォームの初期値をセットする処理を追加
    function updateTimeInputFromLaunch(launch) {
      const netDate = new Date(launch.net);
      // datetime-local 形式 (YYYY-MM-DDTHH:mm:ss) に変換するため slice(0, 19) に変更
      const localIso = new Date(netDate.getTime() - (netDate.getTimezoneOffset() * 60000))
                        .toISOString().slice(0, 19);
      document.getElementById('netInput').value = localIso;
    }

    // sequences.js の sequencePresets からデータを取得して返すように実装
    function getSequencePreset(launch) {
      // 万が一 sequences.js が読み込まれていない場合の安全策
      const presets = typeof sequencePresets !== 'undefined' ? sequencePresets : { default: { name: "標準ミッション", prefix: "T", timeline: [] } };

      const text = `${launch.name} ${launch.provider} ${launch.rocket} ${launch.pad}`.toLowerCase();
      if (text.includes("transporter-18") || text.includes("transporter 18")) return JSON.parse(JSON.stringify(presets.transporter18 || presets.default));
      if (text.includes("crew-13") || text.includes("crew13") || text.includes("dragon")) return JSON.parse(JSON.stringify(presets.crew13 || presets.default));
      if (text.includes("ariane") || text.includes("アリアン") || text.includes("kourou") || text.includes("フランス")) return JSON.parse(JSON.stringify(presets.ariane5_6 || presets.default));
      if (text.includes("pslv")) return JSON.parse(JSON.stringify(presets.pslv || presets.default));
      if (text.includes("lvm3")) return JSON.parse(JSON.stringify(presets.lvm3 || presets.default));
      if (text.includes("sslv")) return JSON.parse(JSON.stringify(presets.sslv || presets.default));
      if (text.includes("gslv")) return JSON.parse(JSON.stringify(presets.gslv || presets.default));
      if (text.includes("astra") || text.includes("アストラ")) return JSON.parse(JSON.stringify(presets.astra || presets.default));
      if (text.includes("virgin") || text.includes("バージン") || text.includes("launcherone")) return JSON.parse(JSON.stringify(presets.virginorbit || presets.default));
      if (text.includes("H3-24") || text.includes("h3 / 24")) return JSON.parse(JSON.stringify(presets.h3_24 || presets.default));
      if (text.includes("jaxa") || text.includes("h3") || text.includes("tanegashima")) return JSON.parse(JSON.stringify(presets.jaxa || presets.default));
      if (text.includes("starship")) return JSON.parse(JSON.stringify(presets.starship || presets.default));
      if (text.includes("heavy")) return JSON.parse(JSON.stringify(presets.falconheavy || presets.default)); 
      if (text.includes("falcon")) return JSON.parse(JSON.stringify(presets.falcon9 || presets.default));
      if (text.includes("long march") || text.includes("長征") || text.includes("cnsa") || text.includes("wenchang")) return JSON.parse(JSON.stringify(presets.longmarch || presets.default));
      if (text.includes("nuri") || text.includes("ヌリ") || text.includes("kari") || text.includes("naro")) return JSON.parse(JSON.stringify(presets.nuri || presets.default));
      if (text.includes("electron") || text.includes("rocket lab") || text.includes("mahia") || text.includes("ニュージーランド")) return JSON.parse(JSON.stringify(presets.electron || presets.default));
      if (text.includes("sls") || text.includes("artemis") || text.includes("nasa")) return JSON.parse(JSON.stringify(presets.sls || presets.default));
      return JSON.parse(JSON.stringify(presets.default));
    }

    function formatTime(seconds) {
      const isNegative = seconds < 0;
      const abs = Math.abs(seconds);
      const h = String(Math.floor(abs / 3600)).padStart(2, '0');
      const m = String(Math.floor((abs % 3600) / 60)).padStart(2, '0');
      const s = String(Math.floor(abs % 60)).padStart(2, '0');
      const prefix = currentPreset.prefix || "T";
      return isNegative ? `${prefix}- ${h}:${m}:${s}` : `${prefix}+ ${h}:${m}:${s}`;
    }

    function formatDuration(seconds) {
      if (seconds <= 0) return "00:00";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      return h > 0 ? `${String(h).padStart(2, '0')}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function updateTelemetry(seconds) {
      const velEl = document.getElementById('telemetryVelocity');
      const altEl = document.getElementById('telemetryAltitude');

      if (liveTelemetryCache && liveTelemetryCache.velocity !== undefined) {
        velEl.textContent = liveTelemetryCache.velocity.toLocaleString() + " km/h";
        altEl.textContent = liveTelemetryCache.altitude.toLocaleString() + " km";
        return;
      }

      if (seconds < 0 || missionState === "SCRUBBED") {
        velEl.textContent = "0 km/h（推定）";
        altEl.textContent = "0.0 km（推定）";
        return;
      }

      let velocity = 0;
      let altitude = 0;

      if (seconds === 0) {
        velocity = 150;
        altitude = 0.05;
      } else {
        velocity = Math.min(28000, Math.floor(200 + Math.pow(seconds, 1.4) * 115));
        altitude = Number(Math.min(400, Math.pow(seconds, 1.3) * 0.45).toFixed(1));
      }

      velEl.textContent = velocity.toLocaleString() + " km/h（推定）";
      altEl.textContent = altitude.toLocaleString() + " km（推定）";
    }

    function renderTimeline(currentDiff) {
      const list = document.getElementById('timelineList');
      list.innerHTML = '';
      let currentEvent = "---";
      let nextEvent = "---";
      let nextEventRemainingSeconds = null;
      let activeElement = null;

      currentPreset.timeline.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'timeline-item';
        if (currentDiff >= item.offset) {
          const nextItem = currentPreset.timeline[index + 1];
          if (!nextItem || currentDiff < nextItem.offset) {
            div.classList.add('active');
            currentEvent = item.label;
            activeElement = div;
            if (nextItem) {
              nextEvent = nextItem.label;
              nextEventRemainingSeconds = nextItem.offset - currentDiff;
            } else {
              nextEvent = "全シーケンス完了";
            }
          } else {
            div.classList.add('passed');
          }
        }
        div.innerHTML = `<span class="time-offset">${formatTime(item.offset)}</span><span>${item.label}</span>`;
        list.appendChild(div);
      });

      if (currentPreset.timeline.length > 0 && currentDiff < currentPreset.timeline[0].offset) {
        currentEvent = "カウントダウン準備中";
        nextEvent = currentPreset.timeline[0].label;
        nextEventRemainingSeconds = currentPreset.timeline[0].offset - currentDiff;
        activeElement = list.firstElementChild;
      }

      document.getElementById('currentEventText').textContent = currentEvent;
      document.getElementById('nextEventText').textContent = nextEvent;

      const cdEl = document.getElementById('nextEventCountdown');
      cdEl.textContent = (nextEventRemainingSeconds !== null && nextEventRemainingSeconds > 0) ? `(in ${formatDuration(nextEventRemainingSeconds)})` : "";

      if (activeElement && window.lastActiveElement !== activeElement) {
        window.lastActiveElement = activeElement;
        const container = document.getElementById('timelineList');
        const containerRect = container.getBoundingClientRect();
        const elementRect = activeElement.getBoundingClientRect();
        container.scrollTop += (elementRect.top - containerRect.top) - (containerRect.height / 2) + (elementRect.height / 2);
      }
    }

    function updateDisplay() {
      const launch = mockLaunches[selectedIndex];
      let diffSeconds = 0;
      if (missionState === "SCRUBBED" || missionState === "HOLD") {
        diffSeconds = heldSeconds;
      } else {
        if (isSimMode) {
          diffSeconds = simT;
          simT++;
          heldSeconds = simT;
        } else {
          diffSeconds = Math.floor((Date.now() - new Date(launch.net).getTime()) / 1000);
          heldSeconds = diffSeconds;
        }
      }

      const badge = document.getElementById('presetBadge');
      if (missionState === "HOLD") {
        badge.textContent = "COUNTDOWN HOLD";
        badge.style.background = "rgba(255, 170, 0, 0.2)";
        badge.style.borderColor = "#ffaa00";
        badge.style.color = "#ffaa00";
      } else if (missionState === "SCRUBBED") {
        badge.textContent = "SCRUBBED (打ち上げ中止)";
        badge.style.background = "rgba(255, 68, 68, 0.2)";
        badge.style.borderColor = "#ff4444";
        badge.style.color = "#ff4444";
      } else {
        badge.textContent = currentPreset.name;
        badge.style.background = "rgba(0, 242, 255, 0.2)";
        badge.style.borderColor = "var(--accent-blue)";
        badge.style.color = "var(--text-main)";
      }

      document.getElementById('timerDisplay').textContent = formatTime(diffSeconds);
      updateTelemetry(diffSeconds);
      renderTimeline(diffSeconds);
    }

    function setMissionTitle(fullName) {
      const titleContainer = document.getElementById('missionTitle');
      titleContainer.innerHTML = '';

      const bracketIndex = Math.min(
        fullName.indexOf('(') !== -1 ? fullName.indexOf('(') : 9999,
        fullName.indexOf('（') !== -1 ? fullName.indexOf('（') : 9999
      );

      if (bracketIndex !== 9999) {
        const mainText = fullName.substring(0, bracketIndex).trim();
        const subText = fullName.substring(bracketIndex).trim();

        const mainSpan = document.createElement('span');
        mainSpan.className = 'mission-main-text';
        mainSpan.textContent = mainText;

        const subSpan = document.createElement('span');
        subSpan.className = 'mission-sub-text';
        subSpan.textContent = subText;

        titleContainer.appendChild(mainSpan);
        titleContainer.appendChild(subSpan);
      } else {
        const mainSpan = document.createElement('span');
        mainSpan.className = 'mission-main-text';
        mainSpan.textContent = fullName;
        titleContainer.appendChild(mainSpan);
      }
    }

    function selectLaunch(index) {
      selectedIndex = index;
      missionState = "RUNNING";
      document.getElementById('holdBtn').textContent = "HOLD";
      document.getElementById('holdBtn').style.background = "rgba(255, 170, 0, 0.15)";
      document.getElementById('holdBtn').style.borderColor = "#ffaa00";

      const launch = mockLaunches[selectedIndex];
      currentPreset = getSequencePreset(launch);

      document.querySelectorAll('.launch-item-btn').forEach((btn, i) => {
        if (i === selectedIndex) btn.classList.add('selected');
        else btn.classList.remove('selected');
      });

      setMissionTitle(launch.name);

      document.getElementById('missionSub').textContent = `${launch.provider} • ${launch.rocket} • ${launch.pad}`;
      document.getElementById('targetTime').textContent = `Target NET: ${new Date(launch.net).toLocaleString()}`;

      // 打ち上げウィンドウの表示設定
      const windowEl = document.getElementById('launchWindow');
      if (launch.window_start && launch.window_end) {
        const startStr = new Date(launch.window_start).toLocaleString();
        const endStr = new Date(launch.window_end).toLocaleTimeString();
        windowEl.textContent = `Launch Window: ${startStr} 〜 ${endStr}`;
      } else {
        windowEl.textContent = `Launch Window: 即時ウィンドウ (Instantaneous)`;
      }

      updateTimeInputFromLaunch(launch);

      // ライブ配信リンクの表示制御
      const liveContainer = document.getElementById('liveLinkContainer');
      const liveBtn = document.getElementById('liveLinkBtn');
      if (launch.webcast_live && launch.webcast_live.trim() !== "") {
        liveBtn.href = launch.webcast_live;
        liveContainer.classList.add('visible');
      } else {
        liveBtn.href = "#";
        liveContainer.classList.remove('visible');
      }

      simT = -10;
      if (timerInterval) clearInterval(timerInterval);
      
      updateDisplay();
      timerInterval = setInterval(updateDisplay, 1000);
    }

    function renderLaunchList() {
      const listContainer = document.getElementById('launchListContainer');
      listContainer.innerHTML = '';
      mockLaunches.forEach((l, i) => {
        const btn = document.createElement('button');
        btn.className = 'launch-item-btn';
        if (i === selectedIndex) btn.classList.add('selected');
        const dateStr = new Date(l.net).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        btn.innerHTML = `
          <div class="launch-item-provider">${l.provider}</div>
          <div class="launch-item-name">${l.name}</div>
          <div class="launch-item-date">${dateStr} (NET)</div>
        `;
        btn.addEventListener('click', () => selectLaunch(i));
        listContainer.appendChild(btn);
      });
    }

    document.getElementById('apiSyncBtn').addEventListener('click', syncLaunchesFromAPI);
    document.getElementById('simBtn').addEventListener('click', () => {
      isSimMode = !isSimMode;
      simT = -10;
      document.getElementById('simBtn').style.borderColor = isSimMode ? '#00f2ff' : 'rgba(0, 242, 255, 0.2)';
      updateDisplay();
    });
    document.getElementById('holdBtn').addEventListener('click', () => {
      if (missionState === "SCRUBBED") return;
      if (missionState === "HOLD") {
        missionState = "RUNNING";
        document.getElementById('holdBtn').textContent = "HOLD";
        document.getElementById('holdBtn').style.background = "rgba(255, 170, 0, 0.15)";
      } else {
        missionState = "HOLD";
        document.getElementById('holdBtn').textContent = "RESUME";
        document.getElementById('holdBtn').style.background = "rgba(0, 255, 128, 0.15)";
      }
      updateDisplay();
    });
    document.getElementById('scrubBtn').addEventListener('click', () => {
      missionState = "SCRUBBED";
      updateDisplay();
    });
    document.getElementById('editBtn').addEventListener('click', () => {
      document.getElementById('jsonInput').value = currentPreset.timeline.map(item => `${item.offset}, ${item.label}`).join('\n');
      document.getElementById('editModal').classList.add('open');
    });
    document.getElementById('cancelEdit').addEventListener('click', () => {
      document.getElementById('editModal').classList.remove('open');
    });
    document.getElementById('saveEdit').addEventListener('click', () => {
      const lines = document.getElementById('jsonInput').value.split('\n');
      const newTimeline = [];
      lines.forEach(line => {
        const parts = line.split(',');
        if (parts.length >= 2) {
          const offset = parseInt(parts[0].trim(), 10);
          const label = parts.slice(1).join(',').trim();
          if (!isNaN(offset) && label) newTimeline.push({ offset, label });
        }
      });
      newTimeline.sort((a, b) => a.offset - b.offset);
      if (newTimeline.length > 0) {
        currentPreset.timeline = newTimeline;
        document.getElementById('editModal').classList.remove('open');
        updateDisplay();
      } else {
        alert('有効なシーケンス行がありません。「秒数, イベント名」の形式で入力してください。');
      }
    });

    renderLaunchList();
    selectLaunch(0);
  </script>
</body>
</html>
