<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Mission Tracker</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(16, 22, 36, 0.85);
      --accent-blue: #00f2ff;
      --accent-glow: rgba(0, 242, 255, 0.3);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: rgba(0, 242, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-blue);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button, input, textarea {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    button {
      cursor: pointer;
      background: rgba(0, 242, 255, 0.15);
      font-weight: bold;
    }

    button:hover {
      background: var(--accent-blue);
      color: #000;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .launch-list-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .launch-scroll-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 600px;
      padding-right: 10px;
      padding-bottom: 20px;
      scroll-behavior: smooth;
    }

    /* スクロールバーの統一スタイル */
    .launch-scroll-container::-webkit-scrollbar,
    .timeline-container::-webkit-scrollbar,
    .modal-content::-webkit-scrollbar,
    textarea::-webkit-scrollbar {
      width: 6px;
    }

    .launch-scroll-container::-webkit-scrollbar-thumb,
    .timeline-container::-webkit-scrollbar-thumb,
    .modal-content::-webkit-scrollbar-thumb,
    textarea::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .launch-item-btn {
      width: 100%;
      text-align: left;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .launch-item-btn:hover {
      background: rgba(0, 242, 255, 0.1);
      border-color: var(--accent-blue);
    }

    .launch-item-btn.selected {
      background: rgba(0, 242, 255, 0.2);
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .launch-item-provider {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .launch-item-name {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .launch-item-date {
      font-size: 0.8rem;
      color: var(--accent-blue);
      margin-top: 4px;
      font-family: monospace;
    }

    .countdown-display {
      text-align: center;
      padding: 20px 10px;
    }

    .mission-title {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .mission-sub {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .timer {
      font-family: monospace, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 3.5rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      letter-spacing: 4px;
      margin: 15px 0;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 242, 255, 0.2);
      border: 1px solid var(--accent-blue);
    }

    .event-status-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      text-align: left;
    }

    .event-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .event-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .event-countdown {
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--text-muted);
      font-weight: bold;
    }

    .event-text {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-card.current .event-text {
      font-size: 1.15rem;
      color: var(--accent-blue);
    }

    .timeline-container {
      max-height: 320px;
      overflow-y: auto;
      padding-right: 10px;
      padding-bottom: 40px;
      margin-top: 15px;
      scroll-behavior: smooth;
    }

    .timeline-item {
      display: flex;
      align-items: baseline;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .timeline-item.active {
      color: var(--accent-blue);
      font-weight: bold;
    }

    .timeline-item.passed {
      opacity: 0.5;
    }

    .time-offset {
      font-family: monospace;
      min-width: 80px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .timeline-item.active .time-offset {
      color: var(--accent-blue);
    }

    .edit-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10;
      justify-content: center;
      align-items: center;
    }

    .edit-modal.open {
      display: flex;
    }

    .modal-content {
      background: #101624;
      border: 1px solid var(--accent-blue);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    textarea {
      width: 100%;
      height: 250px;
      background: #05070a;
      border: 1px solid var(--border-color);
      color: #00f2ff;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      margin: 15px 0;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Launch Mission Tracker</h1>
      <div class="controls">
        <button id="apiSyncBtn" style="background: rgba(0, 255, 128, 0.15); border-color: #00ff80;">API同期</button>
        <button id="simBtn">シミュレーション切替</button>
        <button id="holdBtn" style="background: rgba(255, 170, 0, 0.15); border-color: #ffaa00;">HOLD</button>
        <button id="scrubBtn" style="background: rgba(255, 68, 68, 0.15); border-color: #ff4444;">SCRUB</button>
        <button id="editBtn">シーケンス編集</button>
      </div>
    </header>

    <div class="main-grid">
      <!-- 左側：打ち上げ一覧リスト -->
      <div class="card launch-list-card">
        <h3 style="color: var(--accent-blue); margin-bottom: 5px;">打ち上げ一覧</h3>
        <div id="launchListContainer" class="launch-scroll-container"></div>
      </div>

      <!-- 右側：メインのカウントダウン & シーケンスタイムライン -->
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div class="card countdown-display">
          <div class="status-badge" id="presetBadge">PRESET</div>
          <h2 class="mission-title" id="missionTitle">ミッションを選択してください</h2>
          <div class="mission-sub" id="missionSub">---</div>
          <div class="timer" id="timerDisplay">T- 00:00:00</div>
          <div id="targetTime" style="color: var(--text-muted); font-size: 0.9rem;"></div>

          <div class="event-status-grid">
            <div class="event-card current">
              <div class="event-header">
                <span class="event-label">CURRENT EVENT</span>
              </div>
              <div class="event-text" id="currentEventText">---</div>
            </div>
            <div class="event-card">
              <div class="event-header">
                <span class="event-label">NEXT EVENT</span>
                <span class="event-countdown" id="nextEventCountdown"></span>
              </div>
              <div class="event-text" id="nextEventText">---</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom: 10px; color: var(--accent-blue);">ミッション シーケンス</h3>
          <div class="timeline-container" id="timelineList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="edit-modal" id="editModal">
    <div class="modal-content">
      <h3>シーケンス 編集</h3>
      <textarea id="jsonInput"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button id="cancelEdit">キャンセル</button>
        <button id="saveEdit">保存</button>
      </div>
    </div>
  </div>

      default: {
        name: "標準ロケット プリセット",
        prefix: "T",
        timeline: [
          { offset: -900, label: "ターミナルカウントダウン開始" },
          { offset: -300, label: "【Go/No-Go ポーリング】 発射可否の最終確認" },
          { offset: -180, label: "自動シーケンス開始" },
          { offset: -10,  label: "最終カウントダウン / 点火準備" },
          { offset: 0,    label: "リフトオフ / メインエンジン点火" },
          { offset: 60,   label: "Max-Q (最大動圧点通過)" },
          { offset: 150,  label: "MECO (メインエンジン停止)" },
          { offset: 160,  label: "第1段分離 / 第2段エンジン点火" },
          { offset: 200,  label: "フェアリング分離" },
          { offset: 500,  label: "SECO (第2段エンジン停止 / 軌道投入)" }
        ]
      }
    };

    // 初期モックデータ（API接続失敗時のフォールバックとしても利用）
    let mockLaunches = [
      { id: "1", name: "Falcon 9 / Starlink Group 8-9", provider: "SpaceX", rocket: "Falcon 9", pad: "Cape Canaveral / LC-40", net: "2026-10-02T08:15:00Z" },
      { id: "2", name: "Electron / Dedicated Mission", provider: "Rocket Lab", rocket: "Electron", pad: "Launch Complex 1", net: "2026-10-05T22:00:00Z" },
      { id: "3", name: "Starship Integrated Flight Test", provider: "SpaceX", rocket: "Starship", pad: "Starbase Texas", net: "2026-10-15T13:00:00Z" },
      { id: "4", name: "H3 Launch Vehicle (Referred Payload)", provider: "JAXA", rocket: "H3", pad: "Tanegashima Space Center", net: "2026-10-20T05:30:00Z" },
      { id: "5", name: "PSLV-C60 Mission", provider: "ISRO", rocket: "PSLV-XL", pad: "Satish Dhawan Space Centre", net: "2026-10-25T04:00:00Z" },
      { id: "6", name: "Soyuz MS-28", provider: "Roscosmos", rocket: "Soyuz 2.1a", pad: "Baikonur Cosmodrome", net: "2026-11-10T11:20:00Z" },
      { id: "7", name: "Long March 8 / Commercial Payload", provider: "CNSA", rocket: "Chang Zheng 8", pad: "Wenchang Spacecraft Launch Site", net: "2026-11-28T06:00:00Z" },
      { id: "8", name: "Nuri Flight 4", provider: "KARI", rocket: "Nuri (KSLV-II)", pad: "Naro Space Center", net: "2026-12-12T02:00:00Z" }
    ];

    mockLaunches.sort((a, b) => new Date(a.net) - new Date(b.net));

    let selectedIndex = 0;
    let timerInterval = null;
    let isSimMode = false;
    let simT = -10;
    let currentPreset = null;

    let missionState = "RUNNING"; // "RUNNING" | "HOLD" | "SCRUBBED"
    let heldSeconds = -10;

    // --- Launch Dashboard API / 外部 API からのデータ同期関数 ---
    async function syncLaunchesFromAPI() {
      const btn = document.getElementById('apiSyncBtn');
      btn.textContent = "同期中...";
      
      try {
        // Launch Library 2 (LL2) API または Launch Dashboard API エンドポイントの例
        const response = await fetch('https://lldev.thespacedevs.com/2.2.0/launch/upcoming/?limit=10', {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        
        if (data && data.results && data.results.length > 0) {
          // APIレスポンスをアプリケーションのデータ構造にマッピング
          mockLaunches = data.results.map((item, index) => ({
            id: item.id || String(index + 1),
            name: item.name || "Unknown Mission",
            provider: item.launch_service_provider?.name || "Unknown Provider",
            rocket: item.rocket?.configuration?.name || "Rocket",
            pad: item.pad?.name || "Launch Pad",
            net: item.net || new Date().toISOString()
          }));

          mockLaunches.sort((a, b) => new Date(a.net) - new Date(b.net));
          selectedIndex = 0;
          renderLaunchList();
          selectLaunch(0);
          btn.textContent = "同期成功！";
        } else {
          throw new Error("No launch data found.");
        }
      } catch (error) {
        console.warn("API同期に失敗したため、フォールバックデータを使用します:", error);
        btn.textContent = "同期失敗(オフライン)";
      }

      setTimeout(() => {
        btn.textContent = "API同期";
      }, 3000);
    }

    function getSequencePreset(launch) {
      const text = `${launch.name} ${launch.provider} ${launch.rocket} ${launch.pad}`.toLowerCase();

      if (text.includes("starship") || text.includes("super heavy")) return JSON.parse(JSON.stringify(sequencePresets.starship));
      if (text.includes("falcon heavy")) return JSON.parse(JSON.stringify(sequencePresets.falconHeavy));
      if (text.includes("falcon")) return JSON.parse(JSON.stringify(sequencePresets.falcon9));
      if (text.includes("jaxa") || text.includes("h3") || text.includes("h-iia") || text.includes("tanegashima")) return JSON.parse(JSON.stringify(sequencePresets.jaxa));
      if (text.includes("electron") || text.includes("rocket lab")) return JSON.parse(JSON.stringify(sequencePresets.electron));
      if (text.includes("isro") || text.includes("pslv") || text.includes("gslv") || text.includes("lvm3") || text.includes("sriharikota") || text.includes("satish dhawan")) return JSON.parse(JSON.stringify(sequencePresets.isro));
      if (text.includes("cnsa") || text.includes("long march") || text.includes("cz-") || text.includes("chang zheng") || text.includes("wenchang") || text.includes("jiuquan") || text.includes("taiyuan") || text.includes("xichang")) return JSON.parse(JSON.stringify(sequencePresets.cnsa));
      if (text.includes("kari") || text.includes("nuri") || text.includes("kslv") || text.includes("narospace")) return JSON.parse(JSON.stringify(sequencePresets.kari));
      if (text.includes("roscosmos") || text.includes("soyuz") || text.includes("proton") || text.includes("angara") || text.includes("baikonur") || text.includes("vostochny") || text.includes("plesetsk")) return JSON.parse(JSON.stringify(sequencePresets.roscosmos));

      return JSON.parse(JSON.stringify(sequencePresets.default));
    }

    function formatTime(seconds) {
      const isNegative = seconds < 0;
      const abs = Math.abs(seconds);
      const h = String(Math.floor(abs / 3600)).padStart(2, '0');
      const m = String(Math.floor((abs % 3600) / 60)).padStart(2, '0');
      const s = String(Math.floor(abs % 60)).padStart(2, '0');
      
      const prefix = currentPreset.prefix || "T";
      if (isNegative) {
        return `${prefix}- ${h}:${m}:${s}`;
      } else {
        return `${prefix}+ ${h}:${m}:${s}`;
      }
    }

    function formatDuration(seconds) {
      if (seconds <= 0) return "00:00";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');

      if (h > 0) {
        const hh = String(h).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      }
      return `${mm}:${ss}`;
    }

    function renderTimeline(currentDiff) {
      const list = document.getElementById('timelineList');
      list.innerHTML = '';

      let currentEvent = "---";
      let nextEvent = "---";
      let nextEventRemainingSeconds = null;
      let activeElement = null;

      currentPreset.timeline.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'timeline-item';
        
        if (currentDiff >= item.offset) {
          const nextItem = currentPreset.timeline[index + 1];
          if (!nextItem || currentDiff < nextItem.offset) {
            div.classList.add('active');
            currentEvent = item.label;
            activeElement = div;
            if (nextItem) {
              nextEvent = nextItem.label;
              nextEventRemainingSeconds = nextItem.offset - currentDiff;
            } else {
              nextEvent = "全シーケンス完了";
              nextEventRemainingSeconds = null;
            }
          } else {
            div.classList.add('passed');
          }
        }

        const offsetStr = formatTime(item.offset);
        div.innerHTML = `<span class="time-offset">${offsetStr}</span><span>${item.label}</span>`;
        list.appendChild(div);
      });

      if (currentPreset.timeline.length > 0 && currentDiff < currentPreset.timeline[0].offset) {
        currentEvent = "カウントダウン準備中";
        nextEvent = currentPreset.timeline[0].label;
        nextEventRemainingSeconds = currentPreset.timeline[0].offset - currentDiff;
        activeElement = list.firstElementChild;
      }

      document.getElementById('currentEventText').textContent = currentEvent;
      document.getElementById('nextEventText').textContent = nextEvent;

      const cdEl = document.getElementById('nextEventCountdown');
      if (nextEventRemainingSeconds !== null && nextEventRemainingSeconds > 0) {
        cdEl.textContent = `(in ${formatDuration(nextEventRemainingSeconds)})`;
      } else {
        cdEl.textContent = "";
      }

      if (activeElement) {
        activeElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function updateDisplay() {
      const launch = mockLaunches[selectedIndex];
      let diffSeconds = 0;

      if (missionState === "SCRUBBED") {
        diffSeconds = heldSeconds;
      } else if (missionState === "HOLD") {
        diffSeconds = heldSeconds;
      } else {
        if (isSimMode) {
          diffSeconds = simT;
          simT++;
          heldSeconds = simT;
        } else {
          const target = new Date(launch.net).getTime();
          const now = Date.now();
          diffSeconds = Math.floor((now - target) / 1000);
          heldSeconds = diffSeconds;
        }
      }

      const badge = document.getElementById('presetBadge');
      if (missionState === "HOLD") {
        badge.textContent = "COUNTDOWN HOLD";
        badge.style.background = "rgba(255, 170, 0, 0.2)";
        badge.style.borderColor = "#ffaa00";
        badge.style.color = "#ffaa00";
      } else if (missionState === "SCRUBBED") {
        badge.textContent = "SCRUBBED (打ち上げ中止)";
        badge.style.background = "rgba(255, 68, 68, 0.2)";
        badge.style.borderColor = "#ff4444";
        badge.style.color = "#ff4444";
      } else {
        badge.textContent = currentPreset.name;
        badge.style.background = "rgba(0, 242, 255, 0.2)";
        badge.style.borderColor = "var(--accent-blue)";
        badge.style.color = "var(--text-main)";
      }

      document.getElementById('timerDisplay').textContent = formatTime(diffSeconds);
      renderTimeline(diffSeconds);
    }

    function selectLaunch(index) {
      selectedIndex = index;
      missionState = "RUNNING";
      document.getElementById('holdBtn').textContent = "HOLD";
      document.getElementById('holdBtn').style.background = "rgba(255, 170, 0, 0.15)";
      document.getElementById('holdBtn').style.borderColor = "#ffaa00";

      const launch = mockLaunches[selectedIndex];
      currentPreset = getSequencePreset(launch);

      document.querySelectorAll('.launch-item-btn').forEach((btn, i) => {
        if (i === selectedIndex) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });

      document.getElementById('missionTitle').textContent = launch.name;
      document.getElementById('missionSub').textContent = `${launch.provider} • ${launch.rocket} • ${launch.pad}`;
      document.getElementById('targetTime').textContent = `Target NET: ${new Date(launch.net).toLocaleString()}`;

      simT = -10;
      if (timerInterval) clearInterval(timerInterval);
      updateDisplay();
      timerInterval = setInterval(updateDisplay, 1000);
    }

    function renderLaunchList() {
      const listContainer = document.getElementById('launchListContainer');
      listContainer.innerHTML = '';
      
      mockLaunches.forEach((l, i) => {
        const btn = document.createElement('button');
        btn.className = 'launch-item-btn';
        if (i === selectedIndex) btn.classList.add('selected');
        
        const dateStr = new Date(l.net).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        
        btn.innerHTML = `
          <div class="launch-item-provider">${l.provider}</div>
          <div class="launch-item-name">${l.name}</div>
          <div class="launch-item-date">${dateStr} (NET)</div>
        `;
        btn.addEventListener('click', () => selectLaunch(i));
        listContainer.appendChild(btn);
      });
    }

    // イベントリスナー設定
    document.getElementById('apiSyncBtn').addEventListener('click', syncLaunchesFromAPI);

    document.getElementById('simBtn').addEventListener('click', () => {
      isSimMode = !isSimMode;
      simT = -10;
      document.getElementById('simBtn').style.borderColor = isSimMode ? '#00f2ff' : 'rgba(0, 242, 255, 0.2)';
      updateDisplay();
    });

    document.getElementById('holdBtn').addEventListener('click', () => {
      if (missionState === "SCRUBBED") return;

      if (missionState === "HOLD") {
        missionState = "RUNNING";
        document.getElementById('holdBtn').textContent = "HOLD";
        document.getElementById('holdBtn').style.background = "rgba(255, 170, 0, 0.15)";
        document.getElementById('holdBtn').style.borderColor = "#ffaa00";
      } else {
        missionState = "HOLD";
        document.getElementById('holdBtn').textContent = "RESUME";
        document.getElementById('holdBtn').style.background = "rgba(0, 255, 128, 0.15)";
        document.getElementById('holdBtn').style.borderColor = "#00ff80";
      }
      updateDisplay();
    });

    document.getElementById('scrubBtn').addEventListener('click', () => {
      missionState = "SCRUBBED";
      document.getElementById('holdBtn').textContent = "HOLD";
      document.getElementById('holdBtn').style.background = "rgba(255, 170, 0, 0.15)";
      document.getElementById('holdBtn').style.borderColor = "#ffaa00";
      updateDisplay();
    });

    document.getElementById('editBtn').addEventListener('click', () => {
      const textLines = currentPreset.timeline.map(item => `${item.offset}, ${item.label}`).join('\n');
      document.getElementById('jsonInput').value = textLines;
      document.getElementById('editModal').classList.add('open');
    });

    document.getElementById('cancelEdit').addEventListener('click', () => {
      document.getElementById('editModal').classList.remove('open');
    });

    document.getElementById('saveEdit').addEventListener('click', () => {
      const rawText = document.getElementById('jsonInput').value;
      const lines = rawText.split('\n');
      const newTimeline = [];

      lines.forEach(line => {
        const parts = line.split(',');
        if (parts.length >= 2) {
          const offset = parseInt(parts[0].trim(), 10);
          const label = parts.slice(1).join(',').trim();
          if (!isNaN(offset) && label) {
            newTimeline.offset = offset; // 修正
            newTimeline.push({ offset, label });
          }
        }
      });

      newTimeline.sort((a, b) => a.offset - b.offset);

      if (newTimeline.length > 0) {
        currentPreset.timeline = newTimeline;
        document.getElementById('editModal').classList.remove('open');
        updateDisplay();
      } else {
        alert('有効なシーケンス行がありません。「秒数, イベント名」の形式で入力してください。');
      }
    });

    // 初期化実行
    renderLaunchList();
    selectLaunch(0);
  </script>
</body>
</html>
