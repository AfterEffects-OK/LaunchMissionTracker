<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Launch Mission Tracker - プリセットエディター</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --danger-color: #da3633;
      --danger-hover: #f85149;
      --input-bg: #0d1117;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    .main-container {
      display: flex;
      gap: 20px;
      flex: 1;
      overflow: hidden;
    }

    /* 左側：プリセット選択サイドバー */
    .sidebar {
      width: 280px;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      padding: 15px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      font-size: 1rem;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .preset-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0;
      margin: 0 0 15px 0;
    }

    .preset-item {
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 5px;
      background-color: var(--input-bg);
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preset-item:hover {
      background-color: #21262d;
    }

    .preset-item.active {
      border-color: var(--accent-color);
      background-color: #1f382b;
    }

    .preset-key {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 右側：メイン編集エリア */
    .editor-pane {
      flex: 1;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #58a6ff;
    }

    /* タブ切り替え */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 5px 10px;
      border-radius: 4px;
    }

    .tab-btn.active {
      background-color: #30363d;
      color: var(--text-color);
    }

    .tab-content {
      display: none;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .tab-content.active {
      display: flex;
    }

    /* タイムラインテーブル */
    .timeline-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    .timeline-table th, .timeline-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .timeline-table th {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .timeline-table input[type="number"] {
      width: 90px;
      padding: 6px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
    }

    /* ボタン共通 */
    button.action-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    button.action-btn:hover {
      background-color: var(--accent-hover);
    }

    button.danger-btn {
      background-color: var(--danger-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.danger-btn:hover {
      background-color: var(--danger-hover);
    }

    button.secondary-btn {
      background-color: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.secondary-btn:hover {
      background-color: #30363d;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    #jsonTextArea {
      font-family: monospace;
      height: 350px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚀 Launch Mission Tracker - プリセットエディター</h1>
    <div style="display: flex; gap: 10px;">
      <button id="importBtn" class="secondary-btn">ファイルインポート</button>
      <input type="file" id="importFile" accept=".js" style="display: none;">
      <button id="exportBtn" class="secondary-btn">sequences.js出力</button>
      <button id="saveGasBtn" class="action-btn">GASに保存</button>
    </div>
  </header>

  <div class="main-container">
    <!-- サイドバー -->
    <div class="sidebar">
      <h2>ミッションプリセット</h2>
      <ul id="presetList" class="preset-list">
        <!-- JSで動的生成 -->
      </ul>
      <button id="addPresetBtn" class="action-btn" style="width: 100%;">＋ 新規ミッション追加</button>
    </div>

    <!-- メインエディター -->
    <div class="editor-pane">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div>
          <span style="font-size: 0.85rem; color: var(--text-muted);">選択中のキー: <code id="currentKeyDisplay" style="color: #58a6ff;">-</code></span>
        </div>
        <button id="deletePresetBtn" class="danger-btn">このミッションを削除</button>
      </div>

      <div class="form-group">
        <label for="inputName">ミッション名</label>
        <input type="text" id="inputName" placeholder="例: H3 F6 (ARTEMIS)">
      </div>

      <div class="form-group">
        <label for="inputPrefix">プレフィックス (カウントダウンの文字)</label>
        <input type="text" id="inputPrefix" placeholder="例: T">
      </div>

      <!-- タブ切り替え -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="visual">ビジュアルエディター</button>
        <button class="tab-btn" data-tab="json">JSON直接編集</button>
      </div>

      <!-- ビジュアルタブ -->
      <div id="tabVisual" class="tab-content active">
        <label>タイムラインイベント</label>
        <table class="timeline-table">
          <thead>
            <tr>
              <th style="width: 120px;">秒数 (オフセット)</th>
              <th>ラベル / イベント名</th>
              <th style="width: 60px;">操作</th>
            </tr>
          </thead>
          <tbody id="timelineRows">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
        <button id="addRowBtn" class="secondary-btn" style="align-self: flex-start;">＋ イベント行を追加</button>
      </div>

      <!-- JSONタブ -->
      <div id="tabJson" class="tab-content" style="display: none;">
        <label for="jsonTextArea">現在のミッションのJSON構造</label>
        <textarea id="jsonTextArea"></textarea>
        <div class="toolbar" style="margin-top: 10px;">
          <button id="applyJsonBtn" class="action-btn">JSONを適用</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Google Apps ScriptのウェブアプリのデプロイURLを設定してください
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyx693J5GdK0IpqyKU7ZPwlkPhvReBbbjP5FiJdDndwuf19tHgXV7xX536VWA_5Rsbp1w/exec";

    let sequencePresets = {};
    let currentSelectedKey = "";

    // GitHubから sequences.js を取得してパースする
    async function fetchFromGithub() {
      try {
        const response = await fetch('sequences.js?v=' + Date.now());
        const text = await response.text();
        
        // "const sequencePresets = { ... };" の形式からJSON部分を抽出
        const cleaned = text.replace(/const\s+sequencePresets\s*=\s*/, '').replace(/;\s*$/, '');
        sequencePresets = JSON.parse(cleaned);

        const keys = Object.keys(sequencePresets);
        if (keys.length > 0) {
          selectPreset(keys[0]);
        }
      } catch (e) {
        console.error("sequences.jsの読み込みに失敗しました", e);
        // フォールバック初期値
        sequencePresets = {
          "default_mission": {
            name: "サンプルミッション",
            prefix: "T",
            timeline: [
              { offset: 0, label: "リフトオフ" }
            ]
          }
        };
        selectPreset("default_mission");
      }
    }

    function renderPresetList() {
      const listEl = document.getElementById('presetList');
      listEl.innerHTML = '';
      
      for (const key in sequencePresets) {
        const li = document.createElement('li');
        li.className = `preset-item ${key === currentSelectedKey ? 'active' : ''}`;
        li.innerHTML = `
          <div>
            <div style="font-weight: 500;">${sequencePresets[key].name || key}</div>
            <div class="preset-key">${key}</div>
          </div>
        `;
        li.addEventListener('click', () => selectPreset(key));
        listEl.appendChild(li);
      }
    }

    function selectPreset(key) {
      currentSelectedKey = key;
      document.getElementById('currentKeyDisplay').textContent = key;
      
      const preset = sequencePresets[key];
      document.getElementById('inputName').value = preset.name || '';
      document.getElementById('inputPrefix').value = preset.prefix || 'T';

      renderPresetList();
      renderTimelineRows();
      updateJsonView();
    }

    function renderTimelineRows() {
      const tbody = document.getElementById('timelineRows');
      tbody.innerHTML = '';
      
      const preset = sequencePresets[currentSelectedKey];
      if (!preset || !preset.timeline) return;

      preset.timeline.forEach((item, index) => {
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
          <td><input type="number" value="${item.offset}" data-index="${index}" class="offset-input"></td>
          <td><input type="text" value="${item.label}" data-index="${index}" class="label-input"></td>
          <td><button class="danger-btn" style="padding: 4px 8px; font-size: 0.8rem;" onclick="removeRow(${index})">削除</button></td>
        `;
        tbody.appendChild(tr);
      });

      // イベントリスナーの付与
      document.querySelectorAll('.offset-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.index);
          preset.timeline[idx].offset = parseInt(e.target.value) || 0;
          preset.timeline.sort((a, b) => a.offset - b.offset);
          updateJsonView();
        });
      });

      document.querySelectorAll('.label-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.index);
          preset.timeline[idx].label = e.target.value;
          updateJsonView();
        });
      });
    }

    function removeRow(index) {
      const preset = sequencePresets[currentSelectedKey];
      preset.timeline.splice(index, 1);
      renderTimelineRows();
      updateJsonView();
    }

    function updateJsonView() {
      const preset = sequencePresets[currentSelectedKey];
      document.getElementById('jsonTextArea').value = JSON.stringify(preset, null, 2);
    }

    document.getElementById('inputName').addEventListener('input', (e) => {
      sequencePresets[currentSelectedKey].name = e.target.value;
      renderPresetList();
      updateJsonView();
    });

    document.getElementById('inputPrefix').addEventListener('input', (e) => {
      sequencePresets[currentSelectedKey].prefix = e.target.value;
      updateJsonView();
    });

    document.getElementById('addRowBtn').addEventListener('click', () => {
      const preset = sequencePresets[currentSelectedKey];
      const lastOffset = preset.timeline.length > 0 ? preset.timeline[preset.timeline.length - 1].offset + 30 : 0;
      preset.timeline.push({ offset: lastOffset, label: "新しいイベント" });
      preset.timeline.sort((a, b) => a.offset - b.offset);
      renderTimelineRows();
      updateJsonView();
    });

    document.getElementById('addPresetBtn').addEventListener('click', () => {
      const newKey = "new_mission_" + Date.now().toString().slice(-4);
      sequencePresets[newKey] = {
        name: "新規ミッション",
        prefix: "T",
        timeline: [
          { offset: 0, label: "リフトオフ" }
        ]
      };
      selectPreset(newKey);
    });

    document.getElementById('deletePresetBtn').addEventListener('click', () => {
      if (Object.keys(sequencePresets).length <= 1) {
        alert('最低1つのプリセットを残す必要があります。');
        return;
      }
      if (confirm(`本当にプリセット「${currentSelectedKey}」を削除しますか？`)) {
        delete sequencePresets[currentSelectedKey];
        currentSelectedKey = Object.keys(sequencePresets)[0];
        selectPreset(currentSelectedKey);
      }
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        const tabName = e.target.dataset.tab;
        if (tabName === 'visual') {
          document.getElementById('tabVisual').classList.add('active');
        } else {
          document.getElementById('tabJson').classList.add('active');
          updateJsonView();
        }
      });
    });

    document.getElementById('applyJsonBtn').addEventListener('click', () => {
      try {
        const parsed = JSON.parse(document.getElementById('jsonTextArea').value);
        if (!parsed.name || !parsed.timeline) throw new Error("無効なフォーマットです。");
        sequencePresets[currentSelectedKey] = parsed;
        renderTimelineRows();
        renderPresetList();
        alert('JSONを適用しました！');
      } catch (err) {
        alert('JSONのパースに失敗しました: ' + err.message);
      }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const fileContent = `const sequencePresets = ${JSON.stringify(sequencePresets, null, 2)};`;
      const blob = new Blob([fileContent], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sequences.js';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          let text = event.target.result;
          text = text.replace(/const\s+sequencePresets\s*=\s*/, '').replace(/;\s*$/, '');
          const imported = JSON.parse(text);
          if (typeof imported === 'object' && imported !== null) {
            sequencePresets = imported;
            const firstKey = Object.keys(sequencePresets)[0];
            selectPreset(firstKey);
            alert('ファイルを正常に読み込みました！');
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    });

    // --- GASへの保存機能 ---
    async function savePresetsToGAS() {
      const payload = {
        sequencePresets: sequencePresets
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          alert("スプレッドシートへの保存が完了しました！");
        } else {
          alert("保存に失敗しました: " + (result.message || "不明なエラー"));
        }
      } catch (e) {
        console.error("通信エラー", e);
        alert("通信エラーが発生しました。");
      }
    }

    document.getElementById('saveGasBtn').addEventListener('click', () => {
      if (confirm("現在の編集内容をGoogleスプレッドシートに保存しますか？")) {
        savePresetsToGAS();
      }
    });

    // 起動時の読み込み実行
    fetchFromGithub();
  </script>
</body>
</html>
