<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Mission Tracker - プリセットエディター</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(16, 22, 36, 0.85);
      --accent-blue: #00f2ff;
      --accent-glow: rgba(0, 242, 255, 0.3);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: rgba(0, 242, 255, 0.2);
      --danger: #ff4444;
      --success: #00ff80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: var(--accent-blue);
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* スクロールバー全体の幅や高さ */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    /* スクロールバーの軌道（背景） */
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6); /* メイン画面に合わせたダークトーン */
      border-radius: 4px;
    }
    
    /* スクロールバーのつまみ（バー部分） */
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4); /* アクセントカラー等に合わせた半透明 */
      border-radius: 4px;
    }
    
    /* ホバー時のつまみ */
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.7);
    }

    button, input, select, a.btn-link {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }

    button, a.btn-link {
      background: rgba(0, 242, 255, 0.15);
      font-weight: bold;
    }

    button:hover, a.btn-link:hover {
      background: var(--accent-blue);
      color: #000;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-danger {
      background: rgba(255, 68, 68, 0.15);
      border-color: var(--danger);
      color: #ff8888;
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.4);
    }

    .btn-success {
      background: rgba(0, 255, 128, 0.15);
      border-color: var(--success);
      color: #00ff80;
    }
    .btn-success:hover {
      background: var(--success);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 128, 0.4);
    }

    .github-bar {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      align-items: center;
      margin-bottom: 5px;
    }

    .github-bar input {
      flex: 1;
      min-width: 300px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .preset-list-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 240px);
      overflow-y: auto;
      margin-top: 15px;
      padding-right: 5px;
    }

    .preset-item {
      width: 100%;
      text-align: left;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preset-item:hover {
      background: rgba(0, 242, 255, 0.1);
      border-color: var(--accent-blue);
    }

    .preset-item.active {
      background: rgba(0, 242, 255, 0.2);
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .preset-key {
      font-size: 0.75rem;
      color: var(--accent-blue);
      font-family: monospace;
    }

    .editor-pane {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      padding-right: 5px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 15px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
      color: var(--text-main);
    }

    .timeline-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .timeline-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .timeline-row {
      display: grid;
      grid-template-columns: 110px 1fr 50px;
      gap: 10px;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .json-output-area {
      width: 100%;
      height: 420px;
      background: #05070a;
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      font-family: monospace;
      padding: 12px;
      border-radius: 6px;
      resize: vertical;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: transparent;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sequence Presets Editor</h1>
      <div class="header-actions">
        <!-- メイン画面へ移動するボタン -->
        <a href="./" class="btn-link">メイン画面へ移動</a>
        <button class="btn-success" id="exportBtn">sequence.js を出力</button>
        <button id="importBtn">ファイルから読込</button>
        <input type="file" id="importFile" style="display: none;" accept=".js,.json">
        <!-- JSONタブ -->
        <div id="tabJson" class="tab-content" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label>現在のプリセットのJSONデータ</label> <button type="button" class="btn-success" id="copyPromptBtn" style="font-size: 0.8rem; padding: 4px 10px;">📋 AI用プロンプトをコピー</button>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">直接編集して反映することも可能です（右下をドラッグして枠を広げられます）。</p> <textarea id="jsonTextArea" class="json-output-area"></textarea> <button class="btn-success" id="applyJsonBtn" style="margin-top: 10px;">JSONを適用する</button>
        </div>
      </div>
    </header>

    <!-- GitHubから直接取得するバー -->
    <div class="github-bar">
      <label style="font-size:0.8rem; white-space:nowrap;">🌐 GitHub Raw URL:</label>
      <input type="text" id="githubUrlInput" value="https://raw.githubusercontent.com/AfterEffects-OK/LaunchMissionTracker/main/sequences.js" placeholder="https://raw.githubusercontent.com/.../sequences.js">
      <button class="btn-success" id="fetchGithubBtn" style="white-space:nowrap;">GitHubから読込</button>
    </div>

    <div class="main-layout">
      <!-- 左側：プリセット一覧 -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="color: var(--accent-blue);">プリセット一覧</h3>
          <button class="btn-success" id="addPresetBtn" style="padding: 4px 10px; font-size: 0.8rem;">＋ 新規追加</button>
        </div>
        <div id="presetList" class="preset-list-container"></div>
      </div>

      <!-- 右側：選択中プリセットの編集フォーム -->
      <div class="card editor-pane" id="editorPane" style="display: none;">
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="visual">ビジュアルエディター</button>
          <button class="tab-btn" data-tab="json">コード確認 (JSON)</button>
        </div>

        <!-- ビジュアルタブ -->
        <div id="tabVisual" class="tab-content">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="editingPresetTitle" style="color: var(--accent-blue);">プリセット編集</h3>
            <button class="btn-danger" id="deletePresetBtn">このプリセットを削除</button>
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div class="form-group">
              <label>識別キー (半角英数)</label>
              <input type="text" id="inputKey" placeholder="例: falcon9">
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>ミッション名 (表示用)</label>
                <input type="text" id="inputName" placeholder="例: SpaceX Falcon 9">
              </div>
              <div class="form-group">
                <label>接頭辞 (Prefix)</label>
                <input type="text" id="inputPrefix" placeholder="T または H など">
              </div>
            </div>

            <div class="timeline-editor-header">
              <label>タイムライン シーケンス一覧 (オフセット秒数順)</label>
              <button class="btn-success" id="addRowBtn" style="padding: 4px 10px; font-size: 0.8rem;">＋ イベント追加</button>
            </div>

            <div id="timelineRowsContainer" class="timeline-rows"></div>
          </div>
        </div>

        <!-- JSONタブ -->
        <div id="tabJson" class="tab-content" style="display: none;">
          <label>現在のプリセットのJSONデータ</label>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">直接編集して反映することも可能です（右下をドラッグして枠を広げられます）。</p>
          <textarea id="jsonTextArea" class="json-output-area"></textarea>
          <button class="btn-success" id="applyJsonBtn" style="margin-top: 10px;">JSONを適用する</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let sequencePresets = {
      default: {
        name: "標準ロケット プリセット",
        prefix: "T",
        timeline: [
          { offset: 0, label: "リフトオフ" }
        ]
      }
    };

    let currentSelectedKey = null;

    // GitHubからのデータ読み込み関数（ローカルの sequences.js を優先、失敗時はRawから取得を試みる）
    async function fetchFromGithub() {
      const url = './sequences.js';
    
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTPエラー: ${response.status}`);
        let text = await response.text();
        
        let parsed = null;
    
        // パターン1:そのままJSONとしてパースを試す
        try {
          parsed = JSON.parse(text);
        } catch (e1) {
          // パターン2: "const sequencePresets = " などを柔軟に削除してパースを試す
          try {
            // 変数代入の記述を除去
            let cleaned = text.replace(/^(const|let|var)\s+[\w$]+\s*=\s*/, '');
            // 末尾のセミコロンや余計な空白を削除
            cleaned = cleaned.trim().replace(/;\s*$/, '');
            parsed = JSON.parse(cleaned);
          } catch (e2) {
            // パターン3: JavaScriptオブジェクトとして安全に評価する（最終手段）
            try {
              const evalFunc = new Function(`${text}; return sequencePresets;`);
              parsed = evalFunc();
            } catch (e3) {
              throw new Error('すべてのパース方式で失敗しました。');
            }
          }
        }
        
        if (typeof parsed === 'object' && parsed !== null && Object.keys(parsed).length > 0) {
          sequencePresets = parsed;
          const firstKey = Object.keys(sequencePresets)[0];
          if (firstKey) {
            selectPreset(firstKey);
          }
          console.log('sequences.js を正常に読み込みました！', sequencePresets);
        } else {
          throw new Error('読み込んだデータが空か、オブジェクトではありません。');
        }
      } catch (err) {
        console.warn('自動読み込みに失敗しました。', err.message);
        // 失敗した場合はフォールバックとして最初のデフォルトプリセットを表示
        const keys = Object.keys(sequencePresets);
        if (keys.length > 0) {
          selectPreset(keys[0]);
        }
      }
    }

    document.getElementById('fetchGithubBtn').addEventListener('click', async () => {
      const url = document.getElementById('githubUrlInput').value.trim();
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTPエラー: ${response.status}`);
        let text = await response.text();
        text = text.replace(/const\s+sequencePresets\s*=\s*/, '').replace(/;\s*$/, '');
        const parsed = JSON.parse(text);
        if (typeof parsed === 'object' && parsed !== null) {
          sequencePresets = parsed;
          const firstKey = Object.keys(sequencePresets)[0];
          if (firstKey) selectPreset(firstKey);
          alert('GitHubから最新データを正常に読み込みました！');
        }
      } catch (err) {
        alert('読み込みに失敗しました（CORS制限等の可能性があります）。「ファイルから読込」をご利用ください。');
      }
    });

    function renderPresetList() {
      const container = document.getElementById('presetList');
      container.innerHTML = '';
      
      Object.keys(sequencePresets).forEach(key => {
        const preset = sequencePresets[key];
        const btn = document.createElement('button');
        btn.className = `preset-item ${key === currentSelectedKey ? 'active' : ''}`;
        btn.innerHTML = `
          <div>
            <div style="font-weight: bold; font-size: 0.95rem;">${preset.name || key}</div>
            <div class="preset-key">${key} (${preset.timeline ? preset.timeline.length : 0} events)</div>
          </div>
        `;
        btn.addEventListener('click', () => selectPreset(key));
        container.appendChild(btn);
      });
    }

    function selectPreset(key) {
      currentSelectedKey = key;
      const preset = sequencePresets[key];
      
      document.getElementById('editorPane').style.display = 'flex';
      document.getElementById('inputKey').value = key;
      document.getElementById('inputName').value = preset.name || '';
      document.getElementById('inputPrefix').value = preset.prefix || 'T';
      
      renderTimelineRows();
      updateJsonView();
      renderPresetList();
    }

    function renderTimelineRows() {
      const container = document.getElementById('timelineRowsContainer');
      container.innerHTML = '';
      const preset = sequencePresets[currentSelectedKey];
      if (!preset.timeline) preset.timeline = [];

      preset.timeline.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'timeline-row';
        row.innerHTML = `
          <input type="number" value="${item.offset}" data-index="${index}" class="timeline-offset" title="オフセット秒数" style="background:#000; border:1px solid var(--border-color); color:var(--accent-blue); padding:6px; border-radius:4px; text-align:center; font-family:monospace;">
          <input type="text" value="${item.label}" data-index="${index}" class="timeline-label" title="イベント名" style="background:#000; border:1px solid var(--border-color); color:var(--text-main); padding:6px; border-radius:4px;">
          <button class="btn-danger delete-row-btn" data-index="${index}" style="padding: 6px; font-size: 0.8rem;">✕</button>
        `;
        container.appendChild(row);
      });

      container.querySelectorAll('.timeline-offset').forEach(input => {
        input.addEventListener('change', (e) => {
          const idx = parseInt(e.target.dataset.index);
          preset.timeline[idx].offset = parseInt(e.target.value) || 0;
          preset.timeline.sort((a, b) => a.offset - b.offset);
          renderTimelineRows();
          updateJsonView();
        });
      });

      container.querySelectorAll('.timeline-label').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.index);
          preset.timeline[idx].label = e.target.value;
          updateJsonView();
        });
      });

      container.querySelectorAll('.delete-row-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.index);
          preset.timeline.splice(idx, 1);
          renderTimelineRows();
          updateJsonView();
        });
      });
    }

    function updateJsonView() {
      const preset = sequencePresets[currentSelectedKey];
      document.getElementById('jsonTextArea').value = JSON.stringify(preset, null, 2);
    }

    document.getElementById('inputKey').addEventListener('input', (e) => {
      const newKey = e.target.value.trim();
      if (!newKey || newKey === currentSelectedKey) return;
      if (sequencePresets[newKey]) {
        alert('その識別キーはすでに存在します。');
        return;
      }
      sequencePresets[newKey] = sequencePresets[currentSelectedKey];
      delete sequencePresets[currentSelectedKey];
      currentSelectedKey = newKey;
      renderPresetList();
    });

    document.getElementById('inputName').addEventListener('input', (e) => {
      sequencePresets[currentSelectedKey].name = e.target.value;
      renderPresetList();
      updateJsonView();
    });

    document.getElementById('inputPrefix').addEventListener('input', (e) => {
      sequencePresets[currentSelectedKey].prefix = e.target.value;
      updateJsonView();
    });

    document.getElementById('addRowBtn').addEventListener('click', () => {
      const preset = sequencePresets[currentSelectedKey];
      const lastOffset = preset.timeline.length > 0 ? preset.timeline[preset.timeline.length - 1].offset + 30 : 0;
      preset.timeline.push({ offset: lastOffset, label: "新しいイベント" });
      preset.timeline.sort((a, b) => a.offset - b.offset);
      renderTimelineRows();
      updateJsonView();
    });

    document.getElementById('addPresetBtn').addEventListener('click', () => {
      const newKey = "new_mission_" + Date.now().toString().slice(-4);
      sequencePresets[newKey] = {
        name: "新規ミッション",
        prefix: "T",
        timeline: [
          { offset: 0, label: "リフトオフ" }
        ]
      };
      selectPreset(newKey);
    });

    document.getElementById('deletePresetBtn').addEventListener('click', () => {
      if (Object.keys(sequencePresets).length <= 1) {
        alert('最低1つのプリセットを残す必要があります。');
        return;
      }
      if (confirm(`本当にプリセット「${currentSelectedKey}」を削除しますか？`)) {
        delete sequencePresets[currentSelectedKey];
        currentSelectedKey = Object.keys(sequencePresets)[0];
        selectPreset(currentSelectedKey);
      }
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        e.target.classList.add('active');
        const tabName = e.target.dataset.tab;
        if (tabName === 'visual') {
          document.getElementById('tabVisual').style.display = 'block';
        } else {
          document.getElementById('tabJson').style.display = 'block';
        }
      });
    });

    document.getElementById('applyJsonBtn').addEventListener('click', () => {
      try {
        const parsed = JSON.parse(document.getElementById('jsonTextArea').value);
        if (!parsed.name || !parsed.timeline) throw new Error("無効なフォーマットです。");
        sequencePresets[currentSelectedKey] = parsed;
        renderTimelineRows();
        alert('JSONを適用しました！');
      } catch (err) {
        alert('JSONのパースに失敗しました: ' + err.message);
      }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const fileContent = `const sequencePresets = ${JSON.stringify(sequencePresets, null, 2)};`;
      const blob = new Blob([fileContent], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sequences.js';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          let text = event.target.result;
          text = text.replace(/const\s+sequencePresets\s*=\s*/, '').replace(/;\s*$/, '');
          const imported = JSON.parse(text);
          if (typeof imported === 'object' && imported !== null) {
            sequencePresets = imported;
            const firstKey = Object.keys(sequencePresets)[0];
            selectPreset(firstKey);
            alert('ファイルを正常に読み込みました！');
          }
        } catch (err) {
          alert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('copyPromptBtn').addEventListener('click', async () => {
      const promptText = `以下の【テキスト】から打ち上げのミッションシーケンス（イベント情報）を抽出し、指定した【JSONフォーマット】に変換してコードブロック出力してください。
    
    【出力ルール】
    1. 時間表記（T- や T+）は「秒数（数値）」に換算して time に格納してください。
       - 例: T- 00:35:00 → -2100
       - 例: T- 00:01:00 → -60
       - 例: T+ 00:00:00 → 0
       - 例: T+ 00:02:30 → 150
    2. 各イベントの名称や説明を日本語で分かりやすく event に記述してください。
    3. イベントは time の昇順（数字が小さい順）で並べてください。
    4. 余計な解説文は含めず、有効な JSON のみを出力してください。
    
    【JSONフォーマット】
    [
      { "time": -2100, "event": "RP-1 燃料 & 液体酸素(LOX) 充填開始" },
      { "time": 0, "event": "リフトオフ (Liftoff)" },
      { "time": 150, "event": "MECO (第1段メインエンジン停止)" }
    ]
    
    【テキスト】
    `;
    
      try {
        await navigator.clipboard.writeText(promptText);
        alert('AI用プロンプトをクリップボードにコピーしました！\nAIチャットに貼り付けてお使いください。');
      } catch (err) {
        // フォールバック（クリップボードAPI非対応時）
        const tempInput = document.createElement('textarea');
        tempInput.value = promptText;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        alert('AI用プロンプトをコピーしました！');
      }
    });

    // 起動時の読み込み実行
    fetchFromGithub();
  </script>
</body>
</html>
